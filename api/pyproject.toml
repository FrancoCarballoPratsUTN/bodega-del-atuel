[project]
name = "bodega-del-atuel-api"
version = "0.1.0"
description = "API REST para Bodegas del Atuel"
requires-python = ">=3.15.1"
dependencies = [
    "fastapi>=0.162",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bodega_api"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: pruebas contra una instancia PostgreSQL real",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
default-groups = ["dev"]
