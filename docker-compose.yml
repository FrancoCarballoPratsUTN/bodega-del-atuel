name: bodega-del-atuel

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: bodega_del_atuel
      BDA_OWNER_PASSWORD: ${BDA_OWNER_PASSWORD:?Definí BDA_OWNER_PASSWORD en .env}
      BDA_DATABASE_PASSWORD: ${BDA_DATABASE_PASSWORD:?Definí BDA_DATABASE_PASSWORD en .env}
      BDA_REPORTES_PASSWORD: ${BDA_REPORTES_PASSWORD:?Definí BDA_REPORTES_PASSWORD en .env}
    volumes:
      - bodega_db_data:/var/lib/postgresql/data
      # Esquema reproducible: migraciones en orden y luego los datos.
      - ./db/migrations/001_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./db/migrations/002_constraints.sql:/docker-entrypoint-initdb.d/02_constraints.sql:ro
      - ./db/migrations/003_funciones.sql:/docker-entrypoint-initdb.d/03_funciones.sql:ro
      - ./db/migrations/004_procedimientos.sql:/docker-entrypoint-initdb.d/04_procedimientos.sql:ro
      - ./db/migrations/005_triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql:ro
      - ./db/migrations/006_vistas.sql:/docker-entrypoint-initdb.d/06_vistas.sql:ro
      - ./db/migrations/007_roles.sql:/docker-entrypoint-initdb.d/07_roles.sql:ro
      - ./db/migrations/008_indices.sql:/docker-entrypoint-initdb.d/08_indices.sql:ro
      - ./db/seed/dump_datos.sql.gz:/docker-entrypoint-initdb.d/09_datos.sql.gz:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgresql -d bodega_del_atuel &&
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgresql
          -d bodega_del_atuel -tAc 'SELECT 1 FROM vino LIMIT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BDA_DATABASE_HOST: db
      BDA_DATABASE_PORT: 5432
      BDA_DATABASE_NAME: bodega_del_atuel
      BDA_DATABASE_USER: rol_api_lectura_escritura
      BDA_DATABASE_PASSWORD: ${BDA_DATABASE_PASSWORD:?Definí BDA_DATABASE_PASSWORD en .env}
      BDA_DATABASE_POOL_MIN_SIZE: 1
      BDA_DATABASE_POOL_MAX_SIZE: 10
      BDA_DATABASE_SSLMODE: ${BDA_DATABASE_SSLMODE:-prefer}
      BDA_CORS_ORIGINS: ${BDA_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  bodega_db_data:
