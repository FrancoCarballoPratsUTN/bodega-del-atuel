name: bodega-del-atuel

services:
  db:
    image: postgres:15.4-bullseye
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seed_local_password}
      POSTGRES_DB: bodega_del_atuel
      BDA_DATABASE_PASSWORD: ${BDA_DATABASE_PASSWORD:-api_password_secreta}
    volumes:
      - bodega_db_data:/var/lib/postgresql/data
      - ./db/seed/dump_completo.sql.gz:/docker-entrypoint-initdb.d/01_dump.sql.gz:ro
      - ./db/migrations/007_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
      - ./db/migrations/008_indices.sql:/docker-entrypoint-initdb.d/03_indices.sql:ro
      - ./db/init/04_current_triggers.sql:/docker-entrypoint-initdb.d/04_current_triggers.sql:ro
      - ./db/init/05_api_password.sh:/docker-entrypoint-initdb.d/05_api_password.sh:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql -d bodega_del_atuel"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./api
    environment:
      BDA_DATABASE_HOST: db
      BDA_DATABASE_PORT: 5432
      BDA_DATABASE_NAME: bodega_del_atuel
      BDA_DATABASE_USER: rol_api_lectura_escritura
      BDA_DATABASE_PASSWORD: ${BDA_DATABASE_PASSWORD:-api_password_secreta}
      BDA_DATABASE_POOL_MIN_SIZE: 1
      BDA_DATABASE_POOL_MAX_SIZE: 10
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bodega_db_data:
